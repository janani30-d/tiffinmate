<!-- =========================================================
     TIFFINMATE LOGIN PAGE
========================================================= -->

<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

    <!-- =========================================================
         META
    ========================================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="PaintCraft - Professional Painting & Home Renovation Services"
    >

    <meta
        name="keywords"
        content="painting, home renovation, interior painting, exterior painting, waterproofing"
    >

    <meta
        name="author"
        content="TiffinMate"
    >

    <title>TiffinMate | Homemade & tiffinitems</title>
    <link
    rel="icon"
    type="image/png"
    href="images/logo.png"
>


    <!-- =========================================================
         GOOGLE FONT
         Inter - Used Consistently Throughout Website
    ========================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- =========================================================
         FONT AWESOME
    ========================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- =========================================================
         MAIN CSS
    ========================================================== -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >


    <!-- =========================================================
         RESPONSIVE CSS
    ========================================================== -->

    <link
        rel="stylesheet"
        href="css/responsive.css"
    >


</head>


<body>


<!-- =========================================================
     LOGIN PAGE
========================================================= -->

<main class="login-page">


    <!-- =====================================================
         TOP BAR
    ====================================================== -->

    <header class="login-topbar">


        <!-- =================================================
             LOGO
        ================================================== -->
        <a
            href="index.html"
            class="login-logo"
            aria-label="TiffinMate Home"
        >
            <img
                src="images/logo.png"
                alt="TiffinMate"
                class="site-logo-image"
            >
        </a>


        <!-- =================================================
             PAGE CONTROLS — RIGHT
        ================================================== -->

        <div class="login-page-controls">


            <!-- =================================================
                 RTL TOGGLE
            ================================================== -->

            <button
                type="button"
                class="login-control-btn"
                id="loginRtlToggle"
                aria-label="Toggle RTL"
                title="Toggle RTL"
            >
            <i class="fa-solid fa-right-left"></i>

               
            </button>


            <!-- =================================================
                 DARK MODE TOGGLE
            ================================================== -->

            <button
                type="button"
                class="login-control-btn"
                id="loginDarkModeToggle"
                aria-label="Toggle dark mode"
                title="Toggle dark mode"
            >


                <svg
                        class="control-icon"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path
                            d="M20.5 15.2A8.5 8.5 0 0 1 8.8 3.5
                               8.5 8.5 0 1 0 20.5 15.2Z"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />
                    </svg>

                
            </button>

        </div>

    </header>



    <!-- =====================================================
         LOGIN CONTENT
    ====================================================== -->

    <section class="login-content">


        <!-- =================================================
             LOGIN CARD
        ================================================== -->

        <div class="login-card">


            <!-- =================================================
                 LOGIN CARD HEADER
            ================================================== -->

            <div class="login-card-header">

                <span class="login-eyebrow">
                    WELCOME BACK
                </span>

                <h1 class="login-title">
                    Login to Your Account
                </h1>

                <p class="login-description">
                    Enter your details to continue to
                    your TiffinMate account.
                </p>

            </div>



            <!-- =================================================
                 LOGIN FORM
            ================================================== -->

            <form
                class="login-form"
                id="tiffinmateLoginForm"
                novalidate
            >


                <!-- =================================================
                     EMAIL FIELD
                ================================================== -->

                <div class="login-field">


                    <!-- EMAIL LABEL -->

                    <label
                        for="loginEmail"
                        class="login-field-label"
                    >
                        Email Address
                    </label>


                    <!-- EMAIL INPUT -->

                    <div class="login-input-wrapper">


                        <!-- EMAIL ICON -->

                        <svg
                            class="login-input-icon"
                            viewBox="0 0 24 24"
                            fill="none"
                            aria-hidden="true"
                        >

                            <rect
                                x="3"
                                y="5"
                                width="18"
                                height="14"
                                rx="2"
                                stroke="currentColor"
                                stroke-width="1.7"
                            />

                            <path
                                d="M4 7L12 13L20 7"
                                stroke="currentColor"
                                stroke-width="1.7"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />

                        </svg>


                        <input
                            type="email"
                            id="loginEmail"
                            name="email"
                            class="login-input"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <!-- EMAIL ERROR -->

                    <span
                        class="login-field-error"
                        id="loginEmailError"
                    ></span>

                </div>



                <!-- =================================================
                     PASSWORD FIELD
                ================================================== -->

                <div class="login-field">


                    <!-- PASSWORD LABEL -->

                    <label
                        for="loginPassword"
                        class="login-field-label"
                    >
                        Password
                    </label>


                    <!-- PASSWORD INPUT -->

                    <div class="login-input-wrapper">


                        <!-- PASSWORD ICON -->

                        <svg
                            class="login-input-icon"
                            viewBox="0 0 24 24"
                            fill="none"
                            aria-hidden="true"
                        >

                            <rect
                                x="5"
                                y="10"
                                width="14"
                                height="10"
                                rx="2"
                                stroke="currentColor"
                                stroke-width="1.7"
                            />

                            <path
                                d="M8 10V7.5C8 5.3 9.8 3.5 12 3.5C14.2 3.5 16 5.3 16 7.5V10"
                                stroke="currentColor"
                                stroke-width="1.7"
                                stroke-linecap="round"
                            />

                        </svg>


                        <!-- PASSWORD INPUT -->

                        <input
                            type="password"
                            id="loginPassword"
                            name="password"
                            class="login-input"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >


                        <!-- =================================================
                             PASSWORD SHOW / HIDE BUTTON
                        ================================================== -->

                        <button
                            type="button"
                            class="login-password-toggle"
                            id="loginPasswordToggle"
                            aria-label="Show password"
                            title="Show password"
                        >


                            <!-- EYE OPEN -->

                            <svg
                                class="login-eye-open"
                                viewBox="0 0 24 24"
                                fill="none"
                                aria-hidden="true"
                            >

                                <path
                                    d="M2.5 12C4.5 8.5 7.8 6.5 12 6.5C16.2 6.5 19.5 8.5 21.5 12C19.5 15.5 16.2 17.5 12 17.5C7.8 17.5 4.5 15.5 2.5 12Z"
                                    stroke="currentColor"
                                    stroke-width="1.7"
                                    stroke-linejoin="round"
                                />

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="2.5"
                                    stroke="currentColor"
                                    stroke-width="1.7"
                                />

                            </svg>


                            <!-- EYE CLOSED -->

                            <svg
                                class="login-eye-closed"
                                viewBox="0 0 24 24"
                                fill="none"
                                aria-hidden="true"
                            >

                                <path
                                    d="M3 3L21 21"
                                    stroke="currentColor"
                                    stroke-width="1.7"
                                    stroke-linecap="round"
                                />

                                <path
                                    d="M10.6 6.7C11.05 6.57 11.52 6.5 12 6.5C16.2 6.5 19.5 8.5 21.5 12C20.65 13.5 19.55 14.75 18.25 15.65"
                                    stroke="currentColor"
                                    stroke-width="1.7"
                                    stroke-linecap="round"
                                />

                                <path
                                    d="M6.1 8.1C4.6 9.05 3.4 10.35 2.5 12C4.5 15.5 7.8 17.5 12 17.5C13.05 17.5 14.05 17.35 15 17.05"
                                    stroke="currentColor"
                                    stroke-width="1.7"
                                    stroke-linecap="round"
                                />

                            </svg>

                        </button>

                    </div>


                    <!-- =================================================
                         FORGOT PASSWORD
                         BELOW PASSWORD BOX
                    ================================================== -->

                    <div class="login-forgot-row">

                        <a
                            href="#"
                            class="login-forgot-link"
                        >
                            Forgot Password?
                        </a>

                    </div>


                    <!-- PASSWORD ERROR -->

                    <span
                        class="login-field-error"
                        id="loginPasswordError"
                    ></span>

                </div>



                <!-- =================================================
                     REMEMBER ME
                ================================================== -->

                <div class="login-options">

                    <label class="login-checkbox-label">

                        <input
                            type="checkbox"
                            id="loginRemember"
                            name="remember"
                        >

                        <span class="login-custom-checkbox"></span>

                        <span>
                            Remember me
                        </span>

                    </label>

                </div>



                <!-- =================================================
                     LOGIN BUTTON
                ================================================== -->

                <button
                    type="submit"
                    class="login-submit-button"
                    id="loginSubmitButton"
                >

                    <span class="login-submit-text">
                        Login
                    </span>

                    <svg
                        class="login-submit-arrow"
                        viewBox="0 0 24 24"
                        fill="none"
                        aria-hidden="true"
                    >

                        <path
                            d="M5 12H19"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                        />

                        <path
                            d="M13 6L19 12L13 18"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />

                    </svg>

                </button>


                <!-- FORM MESSAGE -->

                <div
                    class="login-form-message"
                    id="loginFormMessage"
                    role="status"
                    aria-live="polite"
                ></div>

            </form>



            <!-- =================================================
                 SOCIAL LOGIN DIVIDER
            ================================================== -->

            <div class="login-divider">

                <span class="login-divider-line"></span>

                <span class="login-divider-text">
                    OR CONTINUE WITH
                </span>

                <span class="login-divider-line"></span>

            </div>



            <!-- =================================================
                 SOCIAL LOGIN BUTTONS
            ================================================== -->

            <div class="login-social-buttons">


                <!-- =================================================
                     GOOGLE
                ================================================== -->

                <button
                    type="button"
                    class="login-social-button login-google-button"
                    id="loginGoogleButton"
                    aria-label="Continue with Google"
                >

                    <!-- GOOGLE ORIGINAL MULTICOLOR SVG -->

                    <svg
                        class="login-social-icon login-google-icon"
                        viewBox="0 0 48 48"
                        aria-hidden="true"
                    >

                        <path
                            fill="#FFC107"
                            d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12S17.4 12 24 12c3.1 0 5.9 1.1 8.1 2.9l5.7-5.7C34.2 6.1 29.4 4 24 4C12.9 4 4 12.9 4 24s8.9 20 20 20s20-8.9 20-20c0-1.2-.1-2.4-.4-3.5z"
                        />

                        <path
                            fill="#FF3D00"
                            d="M6.3 14.7l6.6 4.8C14.7 16 19 12 24 12c3.1 0 5.9 1.1 8.1 2.9l5.7-5.7C34.2 6.1 29.4 4 24 4C16.3 4 9.6 8.3 6.3 14.7z"
                        />

                        <path
                            fill="#4CAF50"
                            d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.5 35.1 26.9 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.4 39.5 16.2 44 24 44z"
                        />

                        <path
                            fill="#1976D2"
                            d="M43.6 20.5H42V20H24v8h11.3c-1.1 3.1-3.7 5.6-7 7.1l6.2 5.2C38.1 36.7 44 31.2 44 24c0-1.2-.1-2.4-.4-3.5z"
                        />

                    </svg>

                    <span>
                        Google
                    </span>

                </button>



                <!-- =================================================
                     FACEBOOK
                ================================================== -->

                <button
                    type="button"
                    class="login-social-button login-facebook-button"
                    id="loginFacebookButton"
                    aria-label="Continue with Facebook"
                >

                    <svg
                        class="login-social-icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        aria-hidden="true"
                    >

                        <path
                            fill="#1877F2"
                            d="M24 12C24 5.37 18.63 0 12 0S0 5.37 0 12c0 5.99 4.39 10.95 10.13 11.85v-8.39H7.08V12h3.05V9.36c0-3.01 1.79-4.68 4.53-4.68 1.31 0 2.68.23 2.68.23v2.95h-1.51c-1.49 0-1.96.93-1.96 1.88V12h3.34l-.53 3.46h-2.81v8.39C19.61 22.95 24 17.99 24 12z"
                        />

                    </svg>

                    <span>
                        Facebook
                    </span>

                </button>



                <!-- =================================================
                     APPLE
                ================================================== -->

                <button
                    type="button"
                    class="login-social-button login-apple-button"
                    id="loginAppleButton"
                    aria-label="Continue with Apple"
                >

                    <svg
                        class="login-social-icon"
                        viewBox="0 0 24 24"
                        fill="currentColor"
                        aria-hidden="true"
                    >

                        <path
                            d="M17.05 20.28C16.13 21.17 15.1 21.06 14.21 20.67C13.27 20.26 12.43 20.23 11.44 20.67C10.2 21.22 9.54 21.06 8.72 20.28C4.53 15.87 5.15 9.61 9.91 9.38C11.07 9.44 11.45 10.02 12.43 10.02C13.47 10.02 13.81 9.44 15.1 9.35C16.67 9.48 17.86 10.12 18.59 11.28C15.35 13.22 16.12 17.49 19.1 18.68C18.55 19.94 17.84 21.18 17.05 20.28ZM12.34 9.33C12.21 7.45 13.74 5.9 15.5 5.69C15.74 7.86 13.53 9.49 12.34 9.33Z"
                        />

                    </svg>

                    <span>
                        Apple
                    </span>

                </button>

            </div>



            <!-- =================================================
                 REGISTER AREA
            ================================================== -->

            <div class="login-register-area">

                <p class="login-register-text">
                    New to TiffinMate?
                </p>

                <a
                    href="register.html"
                    class="login-register-link"
                >
                    Create an Account
                </a>

            </div>



            <!-- =================================================
                 TERMS & PRIVACY
            ================================================== -->

            <p class="login-terms">

                By continuing, you agree to TiffinMate's

                <a href="terms.html">
                    Terms
                </a>

                and

                <a href="privacy.html">
                    Privacy Policy
                </a>.

            </p>


        </div>

    </section>


</main>


<!-- =========================================================
     LOGIN JAVASCRIPT
========================================================= -->

<script src="js/script.js"></script>


</body>

</html>
